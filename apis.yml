description: >-
  Rio Tinto is a British-Australian multinational mining and metals
  corporation and one of the world's largest producers of iron ore, aluminum,
  copper, and diamonds. Rio Tinto does not publish a public developer API,
  but operates supplier portals (Supplier Master Data Management and a
  transactional platform) and a START traceability program. Its GitHub
  presence is limited to a small number of internal forks (ai-sentry,
  xpano).

